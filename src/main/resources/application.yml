spring:
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    apiversion:
      use:
        header: API-Version
      default: "1"
      supported: "1"
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8090
  servlet:
    context-path: /skeleton
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: true
      rotate: true
      directory: ${spring.profiles.active}
      pattern: common
      prefix: access_log
      suffix: .log
    basedir: logs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  file:
    name: logs/${spring.profiles.active}/spring_skeleton.log
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      file-name-pattern: logs/archived/${spring.profiles.active}/spring_skeleton-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

jwt:
  secret-key: ${JWT_SECRET_KEY:jwtSecret_123@@##$$%211_ThisIsADefaultKeyForDevelopmentOnlyPleaseChangeInProduction}
  validity: ${JWT_VALIDITY:3h}
  issuer: ${JWT_ISSUER:spring-skeleton}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
