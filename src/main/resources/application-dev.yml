# With Docker running, spring-boot-docker-compose starts compose.yaml and overrides the datasource below.
# Without Docker, set SPRING_DOCKER_COMPOSE_ENABLED=false and point DB_* at a running PostgreSQL.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/db_name}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    show-sql: true
  flyway:
    # Existing dev databases created by Hibernate's ddl-auto are baselined at V1 instead of failing
    baseline-on-migrate: true
